<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>HCM Shelter Apps</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f4f6fb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.75rem 2rem;
    }

    .app-title {
      text-align: center;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: #1e2b3c;
      margin: 0.5rem 0 1.5rem;
      width: 100%;
      word-break: break-word;
      line-height: 1.2;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }

    .app-title:hover {
      color: #2b6c9e;
    }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    .link-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.6);
      height: 100%;
      min-height: 240px;
    }

    .card-header {
      padding: 1rem 1.25rem;
      background: #ffffff;
      border-bottom: 1px solid #edf2f7;
      font-weight: 600;
      font-size: 1.1rem;
      color: #0b1a2b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: default;
      user-select: none;
      word-break: break-word;
      line-height: 1.35;
      gap: 8px;
    }

    .card-header .header-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tombol hapus cepat di header kartu */
    .card-header .header-delete {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: background 0.15s, color 0.15s;
      opacity: 0;
      pointer-events: none;
    }

    .link-card:hover .header-delete,
    .card-header .header-delete:focus {
      opacity: 1;
      pointer-events: auto;
    }

    .card-header .header-delete:hover {
      background: #fee2e2;
      color: #b91c1c;
    }

    @media (hover: none) {
      .card-header .header-delete {
        opacity: 1;
        pointer-events: auto;
      }
    }

    .iframe-container {
      position: relative;
      flex: 1;
      background: #f0f4fa;
      min-height: 160px;
      overflow: hidden;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 20, 30, 0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.25);
      animation: modalFadeIn 0.2s ease;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Header modal: judul kiri, tombol hapus kanan */
    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 0.25rem;
    }

    .modal-header h3 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0b1a2b;
      flex: 1;
      min-width: 0;
    }

    /* Tombol hapus di sudut kanan atas dialog */
    .modal-delete-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: background 0.15s, transform 0.1s;
      margin-top: 2px;
    }

    .modal-delete-icon:hover {
      background: #fecaca;
    }

    .modal-delete-icon:active {
      transform: scale(0.94);
    }

    .modal-delete-icon:disabled {
      background: #f1f5f9;
      color: #cbd5e1;
      cursor: not-allowed;
    }

    .modal-content .subhead {
      color: #62748c;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #1e2b3c;
    }

    .form-group input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1.5px solid #dfe7ef;
      border-radius: 16px;
      font-size: 1rem;
      background: #fbfdff;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2b6c9e;
      box-shadow: 0 0 0 4px rgba(43, 108, 158, 0.1);
      background: white;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.75rem;
    }

    .btn {
      flex: 1;
      padding: 0.9rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #1e2b3c;
      color: white;
    }

    .btn-primary:hover {
      background: #2d3f53;
    }

    .btn-secondary {
      background: #f0f4fa;
      color: #3a4b5e;
    }

    .btn-secondary:hover {
      background: #e3eaf3;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .confirm-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 20, 30, 0.55);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1100;
      padding: 1rem;
    }

    .confirm-overlay.active {
      display: flex;
    }

    .confirm-box {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: modalFadeIn 0.2s ease;
    }

    .confirm-box h4 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0b1a2b;
      margin-bottom: 0.5rem;
    }

    .confirm-box p {
      color: #62748c;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .confirm-actions {
      display: flex;
      gap: 0.75rem;
    }

    @media (max-width: 480px) {
      .app-title { font-size: 1.6rem; }
      .link-card { border-radius: 20px; min-height: 200px; }
      .card-header { padding: 0.9rem 1rem; font-size: 1rem; }
      .modal-content { padding: 1.5rem 1.25rem; }
      .modal-header h3 { font-size: 1.3rem; }
      .modal-delete-icon { width: 32px; height: 32px; }
    }

    .bento-grid[data-count="1"] { grid-template-columns: 1fr; }
    .bento-grid[data-count="2"] { grid-template-columns: repeat(2, 1fr); }
    .bento-grid[data-count="3"] { grid-template-columns: repeat(3, 1fr); }
    .bento-grid[data-count="4"] { grid-template-columns: repeat(2, 1fr); }

    .bento-grid[data-count="5"] { grid-template-columns: repeat(6, 1fr); }
    .bento-grid[data-count="5"] .link-card:nth-child(1),
    .bento-grid[data-count="5"] .link-card:nth-child(2),
    .bento-grid[data-count="5"] .link-card:nth-child(3) { grid-column: span 2; }
    .bento-grid[data-count="5"] .link-card:nth-child(4),
    .bento-grid[data-count="5"] .link-card:nth-child(5) { grid-column: span 3; }

    .bento-grid[data-count="6"],
    .bento-grid[data-count="7"],
    .bento-grid[data-count="8"],
    .bento-grid[data-count="9"] { grid-template-columns: repeat(3, 1fr); }

    @media (max-width: 600px) {
      .bento-grid { grid-template-columns: 1fr !important; }
      .bento-grid[data-count="5"] .link-card,
      .bento-grid[data-count="5"] .link-card:nth-child(1),
      .bento-grid[data-count="5"] .link-card:nth-child(2),
      .bento-grid[data-count="5"] .link-card:nth-child(3),
      .bento-grid[data-count="5"] .link-card:nth-child(4),
      .bento-grid[data-count="5"] .link-card:nth-child(5) {
        grid-column: span 1 !important;
      }
      .bento-grid[data-count="2"], .bento-grid[data-count="3"],
      .bento-grid[data-count="4"], .bento-grid[data-count="5"],
      .bento-grid[data-count="6"], .bento-grid[data-count="7"],
      .bento-grid[data-count="8"], .bento-grid[data-count="9"] {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>

  <h1 class="app-title" id="appTitle">HCM Shelter Apps</h1>

  <div class="bento-grid" id="bentoGrid" data-count="1"></div>

  <!-- Modal Edit -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">

      <!-- Header modal: judul di kiri, tombol hapus di kanan atas -->
      <div class="modal-header">
        <h3 id="modalTitle">Edit Link</h3>
        <button type="button" class="modal-delete-icon" id="deleteBtn" aria-label="Hapus kartu" title="Hapus kartu ini">🗑️</button>
      </div>

      <p class="subhead">Masukkan URL dan judul untuk kartu ini</p>

      <form id="linkForm">
        <div class="form-group">
          <label for="inputJudul">Judul (Header)</label>
          <input type="text" id="inputJudul" placeholder="Contoh: Google" autocomplete="off" required>
        </div>
        <div class="form-group">
          <label for="inputUrl">URL</label>
          <input type="url" id="inputUrl" placeholder="https://example.com" autocomplete="off" required>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Batal</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Konfirmasi Hapus -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h4>Hapus Kartu?</h4>
      <p id="confirmText">Kartu ini akan dihapus permanen. Lanjutkan?</p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-secondary" id="confirmCancel">Batal</button>
        <button type="button" class="btn btn-danger" id="confirmDelete">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      let links = [{ judul: '', url: '' }];
      let editingIndex = null;

      const appTitle = document.getElementById('appTitle');
      const bentoGrid = document.getElementById('bentoGrid');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalTitle = document.getElementById('modalTitle');
      const linkForm = document.getElementById('linkForm');
      const inputJudul = document.getElementById('inputJudul');
      const inputUrl = document.getElementById('inputUrl');
      const cancelBtn = document.getElementById('cancelBtn');
      const deleteBtn = document.getElementById('deleteBtn');
      const confirmOverlay = document.getElementById('confirmOverlay');
      const confirmText = document.getElementById('confirmText');
      const confirmCancel = document.getElementById('confirmCancel');
      const confirmDelete = document.getElementById('confirmDelete');

      function renderCards() {
        bentoGrid.setAttribute('data-count', links.length);
        bentoGrid.innerHTML = '';

        if (links.length === 0) {
          links.push({ judul: '', url: '' });
          bentoGrid.setAttribute('data-count', '1');
        }

        links.forEach((link, index) => {
          const card = document.createElement('div');
          card.className = 'link-card';

          const header = document.createElement('div');
          header.className = 'card-header';

          const headerText = document.createElement('span');
          headerText.className = 'header-text';
          headerText.textContent = link.judul.trim() !== '' ? link.judul : 'Judul belum diisi';

          // Tombol hapus cepat di header kartu
          const quickDelete = document.createElement('button');
          quickDelete.className = 'header-delete';
          quickDelete.type = 'button';
          quickDelete.innerHTML = '🗑️';
          quickDelete.setAttribute('aria-label', 'Hapus kartu');
          quickDelete.addEventListener('click', (e) => {
            e.stopPropagation();
            editingIndex = index;
            openDeleteConfirm();
          });

          header.appendChild(headerText);
          header.appendChild(quickDelete);

          // 3x klik header untuk edit
          let clickCount = 0;
          let clickTimer = null;
          header.addEventListener('click', (e) => {
            if (e.target.closest('.header-delete')) return;
            clickCount++;
            if (clickTimer) clearTimeout(clickTimer);
            if (clickCount === 3) {
              clickCount = 0;
              openEditModal(index);
              return;
            }
            clickTimer = setTimeout(() => {
              clickCount = 0;
              clickTimer = null;
            }, 400);
          });

          const iframeContainer = document.createElement('div');
          iframeContainer.className = 'iframe-container';

          if (link.url && link.url.trim() !== '') {
            const iframe = document.createElement('iframe');
            let url = link.url.trim();
            if (!/^https?:\/\//i.test(url) && !/^\/\//.test(url)) {
              url = 'https://' + url;
            }
            iframe.src = url;
            iframe.loading = 'lazy';
            iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms allow-modals');
            iframe.setAttribute('referrerpolicy', 'no-referrer');
            iframe.allowFullscreen = true;
            iframeContainer.appendChild(iframe);
          }

          card.appendChild(header);
          card.appendChild(iframeContainer);
          bentoGrid.appendChild(card);
        });
      }

      function openEditModal(index) {
        editingIndex = index;
        const link = links[index] || { judul: '', url: '' };

        modalTitle.textContent = 'Edit Link';
        inputJudul.value = link.judul || '';
        inputUrl.value = link.url || '';

        // Nonaktifkan tombol hapus jika ini satu-satunya kartu DAN masih kosong
        const hanyaSatuKartu = links.length === 1;
        const kartuKosong = (!link.judul || link.judul.trim() === '') && (!link.url || link.url.trim() === '');

        if (hanyaSatuKartu && kartuKosong) {
          deleteBtn.disabled = true;
          deleteBtn.title = 'Tidak bisa menghapus satu-satunya kartu kosong';
        } else {
          deleteBtn.disabled = false;
          deleteBtn.title = 'Hapus kartu ini';
        }

        modalOverlay.classList.add('active');
        setTimeout(() => inputJudul.focus(), 100);
      }

      function closeModal() {
        modalOverlay.classList.remove('active');
        editingIndex = null;
        linkForm.reset();
      }

      function saveLink(e) {
        e.preventDefault();
        const judul = inputJudul.value.trim();
        const url = inputUrl.value.trim();
        const finalJudul = judul !== '' ? judul : 'Tanpa Judul';

        if (editingIndex !== null && links[editingIndex]) {
          links[editingIndex].judul = finalJudul;
          links[editingIndex].url = url;
        }

        renderCards();
        closeModal();
      }

      function openDeleteConfirm() {
        if (editingIndex === null) return;
        const link = links[editingIndex];
        const nama = (link.judul && link.judul.trim() !== '' && link.judul !== 'Tanpa Judul')
          ? `"${link.judul}"`
          : 'ini';
        confirmText.textContent = `Kartu ${nama} akan dihapus permanen. Lanjutkan?`;
        confirmOverlay.classList.add('active');
      }

      function closeDeleteConfirm() {
        confirmOverlay.classList.remove('active');
      }

      function executeDelete() {
        if (editingIndex === null) return;
        links.splice(editingIndex, 1);
        if (links.length === 0) {
          links.push({ judul: '', url: '' });
        }
        closeDeleteConfirm();
        closeModal();
        renderCards();
      }

      linkForm.addEventListener('submit', saveLink);
      cancelBtn.addEventListener('click', closeModal);
      deleteBtn.addEventListener('click', openDeleteConfirm);
      confirmCancel.addEventListener('click', closeDeleteConfirm);
      confirmDelete.addEventListener('click', executeDelete);

      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });
      confirmOverlay.addEventListener('click', (e) => {
        if (e.target === confirmOverlay) closeDeleteConfirm();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (confirmOverlay.classList.contains('active')) closeDeleteConfirm();
          else if (modalOverlay.classList.contains('active')) closeModal();
        }
      });

      // 3x klik judul untuk tambah kartu
      let titleClickCount = 0;
      let titleClickTimer = null;
      appTitle.addEventListener('click', () => {
        titleClickCount++;
        if (titleClickTimer) clearTimeout(titleClickTimer);
        if (titleClickCount === 3) {
          titleClickCount = 0;
          addNewCard();
          return;
        }
        titleClickTimer = setTimeout(() => {
          titleClickCount = 0;
          titleClickTimer = null;
        }, 400);
      });

      function addNewCard() {
        links.push({ judul: '', url: '' });
        renderCards();
        setTimeout(() => {
          const cards = bentoGrid.querySelectorAll('.link-card');
          const lastCard = cards[cards.length - 1];
          if (lastCard) lastCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 50);
      }

      renderCards();
    })();
  </script>
</body>
</html>
