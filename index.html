<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>HCM Shelter Apps</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f4f6fb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem 0.75rem 2rem;
    }

    /* Judul aplikasi di tengah atas — bisa diklik 3x untuk tambah kartu */
    .app-title {
      text-align: center;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: #1e2b3c;
      margin: 0.5rem 0 1.5rem;
      width: 100%;
      word-break: break-word;
      line-height: 1.2;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }

    .app-title:hover {
      color: #2b6c9e;
    }

    /* Bento grid */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      transition: all 0.2s;
    }

    /* Kartu link */
    .link-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05), 0 2px 6px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.6);
      height: 100%;
      min-height: 240px;
    }

    .link-card:hover {
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.08);
    }

    /* Header (caption link) — bisa diklik 3x */
    .card-header {
      padding: 1rem 1.25rem;
      background: #ffffff;
      border-bottom: 1px solid #edf2f7;
      font-weight: 600;
      font-size: 1.1rem;
      color: #0b1a2b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: default;
      user-select: none;
      transition: background 0.15s;
      word-break: break-word;
      line-height: 1.35;
    }

    .card-header:active {
      background: #f8fafd;
    }

    .card-header .header-text {
      flex: 1;
      margin-right: 8px;
    }

    /* Preview iframe */
    .iframe-container {
      position: relative;
      flex: 1;
      background: #f0f4fa;
      min-height: 160px;
      overflow: hidden;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    /* Modal popup setting */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 20, 30, 0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 28px;
      width: 100%;
      max-width: 420px;
      padding: 1.75rem 1.5rem 1.75rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.25);
      animation: modalFadeIn 0.2s ease;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-content h3 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #0b1a2b;
    }

    .modal-content .subhead {
      color: #62748c;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #1e2b3c;
      letter-spacing: 0.01em;
    }

    .form-group input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1.5px solid #dfe7ef;
      border-radius: 16px;
      font-size: 1rem;
      transition: border 0.15s, box-shadow 0.15s;
      background: #fbfdff;
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2b6c9e;
      box-shadow: 0 0 0 4px rgba(43, 108, 158, 0.1);
      background: white;
    }

    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.75rem;
    }

    /* Baris tombol hapus terpisah */
    .modal-actions-delete {
      margin-top: 1rem;
    }

    .btn {
      flex: 1;
      padding: 0.9rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #1e2b3c;
      color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }

    .btn-primary:hover {
      background: #2d3f53;
    }

    .btn-secondary {
      background: #f0f4fa;
      color: #3a4b5e;
    }

    .btn-secondary:hover {
      background: #e3eaf3;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    /* Modal konfirmasi hapus */
    .confirm-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 20, 30, 0.55);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1100;
      padding: 1rem;
    }

    .confirm-overlay.active {
      display: flex;
    }

    .confirm-box {
      background: white;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: modalFadeIn 0.2s ease;
    }

    .confirm-box h4 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0b1a2b;
      margin-bottom: 0.5rem;
    }

    .confirm-box p {
      color: #62748c;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .confirm-actions {
      display: flex;
      gap: 0.75rem;
    }

    /* responsive kecil */
    @media (max-width: 480px) {
      .app-title {
        font-size: 1.6rem;
        margin-bottom: 1rem;
      }

      .bento-grid {
        gap: 1rem;
      }

      .link-card {
        border-radius: 20px;
        min-height: 200px;
      }

      .card-header {
        padding: 0.9rem 1rem;
        font-size: 1rem;
      }

      .modal-content {
        padding: 1.5rem 1.25rem;
      }
    }

    /* untuk 1 kartu: full width */
    .bento-grid[data-count="1"] {
      grid-template-columns: 1fr;
    }

    /* 2 kartu: 2 kolom */
    .bento-grid[data-count="2"] {
      grid-template-columns: repeat(2, 1fr);
    }

    /* 3 kartu: 3 kolom */
    .bento-grid[data-count="3"] {
      grid-template-columns: repeat(3, 1fr);
    }

    /* 4 kartu: 2x2 */
    .bento-grid[data-count="4"] {
      grid-template-columns: repeat(2, 1fr);
    }

    /* 5 kartu: 3 + 2 */
    .bento-grid[data-count="5"] {
      grid-template-columns: repeat(6, 1fr);
    }
    .bento-grid[data-count="5"] .link-card:nth-child(1),
    .bento-grid[data-count="5"] .link-card:nth-child(2),
    .bento-grid[data-count="5"] .link-card:nth-child(3) {
      grid-column: span 2;
    }
    .bento-grid[data-count="5"] .link-card:nth-child(4),
    .bento-grid[data-count="5"] .link-card:nth-child(5) {
      grid-column: span 3;
    }

    /* ≥6 kartu: 3 kolom */
    .bento-grid[data-count="6"],
    .bento-grid[data-count="7"],
    .bento-grid[data-count="8"],
    .bento-grid[data-count="9"] {
      grid-template-columns: repeat(3, 1fr);
    }

    /* mobile override: semua jadi 1 kolom di bawah 600px */
    @media (max-width: 600px) {
      .bento-grid {
        grid-template-columns: 1fr !important;
      }
      .bento-grid[data-count="5"] .link-card,
      .bento-grid[data-count="5"] .link-card:nth-child(1),
      .bento-grid[data-count="5"] .link-card:nth-child(2),
      .bento-grid[data-count="5"] .link-card:nth-child(3),
      .bento-grid[data-count="5"] .link-card:nth-child(4),
      .bento-grid[data-count="5"] .link-card:nth-child(5) {
        grid-column: span 1 !important;
      }
      .bento-grid[data-count="2"],
      .bento-grid[data-count="3"],
      .bento-grid[data-count="4"],
      .bento-grid[data-count="5"],
      .bento-grid[data-count="6"],
      .bento-grid[data-count="7"],
      .bento-grid[data-count="8"],
      .bento-grid[data-count="9"] {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>

  <h1 class="app-title" id="appTitle" title="Klik 3x untuk menambah kartu baru">HCM Shelter Apps</h1>

  <div class="bento-grid" id="bentoGrid" data-count="1">
    <!-- Kartu akan dirender oleh JavaScript -->
  </div>

  <!-- Modal Popup untuk edit link -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <h3 id="modalTitle">Edit Link</h3>
      <p class="subhead">Masukkan URL dan judul untuk kartu ini</p>

      <form id="linkForm">
        <div class="form-group">
          <label for="inputJudul">Judul (Header)</label>
          <input type="text" id="inputJudul" placeholder="Contoh: Google" autocomplete="off" required>
        </div>
        <div class="form-group">
          <label for="inputUrl">URL</label>
          <input type="url" id="inputUrl" placeholder="https://example.com" autocomplete="off" required>
        </div>

        <!-- Tombol Simpan/Batal -->
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Batal</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Simpan</button>
        </div>

        <!-- Tombol Hapus (hanya muncul jika kartu sudah memiliki data) -->
        <div class="modal-actions modal-actions-delete" id="deleteRow" style="display: none;">
          <button type="button" class="btn btn-danger" id="deleteBtn">Hapus Kartu Ini</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Konfirmasi Hapus -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h4>Hapus Kartu?</h4>
      <p id="confirmText">Kartu ini akan dihapus permanen. Lanjutkan?</p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-secondary" id="confirmCancel">Batal</button>
        <button type="button" class="btn btn-danger" id="confirmDelete">Ya, Hapus</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Data links — default 1 kartu kosong
      let links = [
        { judul: '', url: '' }
      ];

      // Index kartu yang sedang diedit
      let editingIndex = null;

      // Elemen DOM
      const appTitle = document.getElementById('appTitle');
      const bentoGrid = document.getElementById('bentoGrid');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalTitle = document.getElementById('modalTitle');
      const linkForm = document.getElementById('linkForm');
      const inputJudul = document.getElementById('inputJudul');
      const inputUrl = document.getElementById('inputUrl');
      const cancelBtn = document.getElementById('cancelBtn');
      const deleteRow = document.getElementById('deleteRow');
      const deleteBtn = document.getElementById('deleteBtn');
      const confirmOverlay = document.getElementById('confirmOverlay');
      const confirmText = document.getElementById('confirmText');
      const confirmCancel = document.getElementById('confirmCancel');
      const confirmDelete = document.getElementById('confirmDelete');

      // Fungsi untuk merender semua kartu
      function renderCards() {
        // Perbarui data-count untuk styling grid
        bentoGrid.setAttribute('data-count', links.length);

        // Kosongkan grid
        bentoGrid.innerHTML = '';

        // Jika tidak ada link, buat satu kartu kosong
        if (links.length === 0) {
          links.push({ judul: '', url: '' });
          bentoGrid.setAttribute('data-count', '1');
        }

        // Buat kartu untuk setiap link
        links.forEach((link, index) => {
          const card = document.createElement('div');
          card.className = 'link-card';
          card.dataset.index = index;

          // Header — bisa diklik 3x untuk edit
          const header = document.createElement('div');
          header.className = 'card-header';
          header.setAttribute('title', 'Klik 3x untuk edit');

          const headerText = document.createElement('span');
          headerText.className = 'header-text';
          headerText.textContent = link.judul.trim() !== '' ? link.judul : 'Judul belum diisi';

          header.appendChild(headerText);

          // Event listener untuk 3x klik
          let clickCount = 0;
          let clickTimer = null;

          header.addEventListener('click', (e) => {
            e.stopPropagation();
            clickCount++;

            if (clickTimer) {
              clearTimeout(clickTimer);
            }

            if (clickCount === 3) {
              clickCount = 0;
              openEditModal(index);
              return;
            }

            clickTimer = setTimeout(() => {
              clickCount = 0;
              clickTimer = null;
            }, 400);
          });

          // Container iframe
          const iframeContainer = document.createElement('div');
          iframeContainer.className = 'iframe-container';

          // Jika URL ada, buat iframe
          if (link.url && link.url.trim() !== '') {
            const iframe = document.createElement('iframe');
            let url = link.url.trim();
            if (!/^https?:\/\//i.test(url) && !/^\/\//.test(url)) {
              url = 'https://' + url;
            }
            iframe.src = url;
            iframe.loading = 'lazy';
            iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts allow-popups allow-forms allow-modals');
            iframe.setAttribute('referrerpolicy', 'no-referrer');
            iframe.allowFullscreen = true;
            iframeContainer.appendChild(iframe);
          }
          // Jika URL kosong: biarkan area abu-abu polos (tanpa teks placeholder)

          card.appendChild(header);
          card.appendChild(iframeContainer);
          bentoGrid.appendChild(card);
        });
      }

      // Buka modal untuk edit index tertentu
      function openEditModal(index) {
        editingIndex = index;
        const link = links[index] || { judul: '', url: '' };

        modalTitle.textContent = 'Edit Link';
        inputJudul.value = link.judul || '';
        inputUrl.value = link.url || '';

        // Tampilkan tombol hapus jika kartu sudah memiliki data (judul atau URL)
        const hasData = (link.judul && link.judul.trim() !== '') || (link.url && link.url.trim() !== '');
        deleteRow.style.display = hasData ? 'flex' : 'none';

        modalOverlay.classList.add('active');
        setTimeout(() => inputJudul.focus(), 100);
      }

      // Tutup modal edit
      function closeModal() {
        modalOverlay.classList.remove('active');
        editingIndex = null;
        linkForm.reset();
      }

      // Simpan data dari form
      function saveLink(e) {
        e.preventDefault();

        const judul = inputJudul.value.trim();
        const url = inputUrl.value.trim();
        const finalJudul = judul !== '' ? judul : 'Tanpa Judul';

        if (editingIndex !== null && links[editingIndex]) {
          links[editingIndex].judul = finalJudul;
          links[editingIndex].url = url;
        }

        renderCards();
        closeModal();
      }

      // Buka konfirmasi hapus
      function openDeleteConfirm() {
        if (editingIndex === null) return;
        const link = links[editingIndex];
        const namaKartu = (link.judul && link.judul.trim() !== '') ? `"${link.judul}"` : 'ini';
        confirmText.textContent = `Kartu ${namaKartu} akan dihapus permanen. Lanjutkan?`;
        confirmOverlay.classList.add('active');
      }

      // Tutup konfirmasi hapus
      function closeDeleteConfirm() {
        confirmOverlay.classList.remove('active');
      }

      // Eksekusi hapus kartu
      function executeDelete() {
        if (editingIndex === null) return;

        links.splice(editingIndex, 1);

        // Jika semua kartu habis, tambahkan satu kartu kosong
        if (links.length === 0) {
          links.push({ judul: '', url: '' });
        }

        closeDeleteConfirm();
        closeModal();
        renderCards();
      }

      // ===== Event Listener =====

      // Form submit
      linkForm.addEventListener('submit', saveLink);

      // Tombol batal modal
      cancelBtn.addEventListener('click', closeModal);

      // Tombol hapus di modal
      deleteBtn.addEventListener('click', openDeleteConfirm);

      // Konfirmasi hapus
      confirmCancel.addEventListener('click', closeDeleteConfirm);
      confirmDelete.addEventListener('click', executeDelete);

      // Klik di luar modal untuk menutup
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });

      confirmOverlay.addEventListener('click', (e) => {
        if (e.target === confirmOverlay) closeDeleteConfirm();
      });

      // Escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (confirmOverlay.classList.contains('active')) {
            closeDeleteConfirm();
          } else if (modalOverlay.classList.contains('active')) {
            closeModal();
          }
        }
      });

      // ===== Klik 3x pada Judul Aplikasi untuk Tambah Kartu Baru =====
      let titleClickCount = 0;
      let titleClickTimer = null;

      appTitle.addEventListener('click', () => {
        titleClickCount++;

        if (titleClickTimer) {
          clearTimeout(titleClickTimer);
        }

        if (titleClickCount === 3) {
          titleClickCount = 0;
          addNewCard();
          return;
        }

        titleClickTimer = setTimeout(() => {
          titleClickCount = 0;
          titleClickTimer = null;
        }, 400);
      });

      // Fungsi tambah kartu baru
      function addNewCard() {
        links.push({ judul: '', url: '' });
        renderCards();

        // Scroll ke kartu terakhir
        setTimeout(() => {
          const cards = bentoGrid.querySelectorAll('.link-card');
          const lastCard = cards[cards.length - 1];
          if (lastCard) {
            lastCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 50);
      }

      // Inisialisasi: render kartu pertama
      renderCards();
    })();
  </script>
</body>
</html>
